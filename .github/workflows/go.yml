name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Prepare Coverage reports
      run: go run github.com/jandelgado/gcov2lcov@v1.1.1 -infile=coverage.out -outfile=coverage.lcov

    - name: Coveralls
      # Not available for pull requests from forks, where GITHUB_TOKEN is
      # read-only, so don't let it fail the build.
      continue-on-error: true
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ${{ github.workspace }}/coverage.lcov

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Deliberately not pinned: the prebuilt binary has to be built with a Go
        # release at least as new as the toolchain above, or loading the standard
        # library fails ("export data version N is greater than maximum
        # supported"). Pinning here while `go-version: stable` moves forward
        # breaks the job every time Go cuts a release.
        version: latest
